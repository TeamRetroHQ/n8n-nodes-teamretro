name: public-release

# Publishes this package to npm with provenance (OIDC trusted publishing). Runs in the public repo
# (TeamRetroHQ/n8n-nodes-teamretro) — the `if:` guard makes it a no-op anywhere else.
#
# Fires automatically when a `release/*` PR is merged into `main` — NOT a manual dispatch. The
# release version is already set in package.json on that branch, so this workflow does NOT bump the
# version: it publishes the merged version as-is, tags the merge commit, and cuts the GitHub
# Release. `tag == source == published`.
#
# Why provenance publishing lives here: npm provenance / OIDC trusted publishing only produces a
# genuine, verifiable attestation when the package is built and published from a public repo —
# which is what n8n's community-node verification checks. The manifest already carries the public
# package name and URLs.
#
# Filename is significant: it is the workflow the npm package registers as its OIDC trusted
# publisher, so keep it `public-release.yml`.

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Publish ONLY from the public repo, and ONLY for a merged `release/*` PR. Any other branch, or
    # a closed-without-merge PR, is skipped.
    if: >
      github.repository == 'TeamRetroHQ/n8n-nodes-teamretro' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag + create the GitHub Release + delete the release branch
      id-token: write   # OIDC token for npm provenance / trusted publishing (no NPM_TOKEN)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }} # exact merge commit, not main's tip (avoids a tag race)
          fetch-depth: 0 # full history + tags

      - name: Install pnpm
        uses: pnpm/action-setup@v6 # version read from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json # reads engines.node (>=20.15)
          cache: pnpm
          # No registry-url / NODE_AUTH_TOKEN: publishing uses OIDC trusted publishing, not a token.

      - name: Use an npm that supports OIDC trusted publishing
        # Trusted publishing (publish with no NPM_TOKEN, provenance via OIDC) requires a recent npm
        # CLI; the one bundled with Node may be older than the setup on the npm package.
        run: npm install -g npm@latest

      - name: Resolve and verify the release version
        id: version
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # release/vX.Y.Z -> vX.Y.Z; guard that it matches the version merged into package.json.
          tag="${GITHUB_HEAD_REF#release/}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::branch tag ($tag) does not match package.json version ($pkg)"; exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm with provenance (OIDC trusted publishing)
        # No NODE_AUTH_TOKEN / NPM_TOKEN: authentication is the OIDC id-token from `id-token: write`.
        # Requires the npm package to have this repo + workflow configured as a trusted publisher.
        run: npm publish --provenance --access public

      - name: Tag the merge commit and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          # Lightweight tag + release, both idempotent so the job can be re-run from the Actions UI.
          # Tag pushes are not blocked by branch protection on `main`.
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          {
            echo "## 🚀 Released \`$tag\`"
            echo
            echo "See the [release page](${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          git push origin --delete "$branch" 2>/dev/null || echo "branch $branch already gone"
